<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TANNU.EXE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    /* Video Player Layer */
    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Lightweight Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 5;
    }

    /* Tap To Start Screen */
    #startScreen {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at center, #152219 0%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .start-pill {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: #00ff88;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .start-title {
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .start-sub {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 30px;
      max-width: 260px;
      line-height: 1.5;
    }

    .btn-glow {
      padding: 16px 36px;
      background: linear-gradient(135deg, #00ff88, #00aa55);
      border: none;
      border-radius: 30px;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
    }

    /* Fixed Floating Interactive UI Overlay for Mobile */
    #actionOverlay {
      position: absolute;
      bottom: calc(18% + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      margin: 0 auto;
      width: 90%;
      max-width: 350px;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    #actionOverlay.visible {
      display: flex;
    }

    .glass-card {
      width: 100%;
      background: rgba(12, 18, 14, 0.95);
      border: 1.5px solid rgba(0, 255, 136, 0.4);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      text-align: center;
    }

    .card-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #00ff88;
      margin-bottom: 8px;
    }

    .card-title {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00ff88, #00cc66);
      border: none;
      border-radius: 14px;
      color: #05140b;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .btn-action:active {
      transform: scale(0.97);
    }

    .input-box {
      width: 100%;
      padding: 13px 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(0, 255, 136, 0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
      text-align: center;
    }
    .input-box::placeholder {
      color: #888;
      font-size: 12px;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 12px;
      margin-bottom: 8px;
      display: none;
    }

    /* Preloader Spinner */
    #loader {
      position: absolute;
      z-index: 15;
      display: none;
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #errorNotice {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      background: rgba(220, 20, 60, 0.95);
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.4;
      z-index: 100;
      display: none;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="mainVideo" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
    <div class="vignette"></div>
    <div id="loader"></div>
    <div id="errorNotice"></div>

    <!-- Start Overlay -->
    <div id="startScreen">
      <div class="start-pill">CLASSIFIED JUNGLE</div>
      <div class="start-title">TANNU.EXE</div>
      <div class="start-sub">Apna volume on rakho aur tap karke start karo.</div>
      <button class="btn-glow" onclick="beginTour()">START</button>
    </div>

    <!-- Action & Question Card -->
    <div id="actionOverlay">
      <div class="glass-card">
        <div class="card-badge" id="cardBadge">ROOM</div>
        <div class="card-title" id="cardPrompt">...</div>
        <div id="cardContent"></div>
      </div>
    </div>
  </div>

  <script>
    // GitHub Repo root ke direct video names match kiye gaye hain
    const STORY_FLOW = [
      {
        video: "01_intro_tour.mp4",
        badge: "JUNGLE ENTRY",
        type: "button",
        prompt: "Panda puch raha hai... Jungle tour pe chalna hai?",
        btnText: "CHALO ➔"
      },
      {
        video: "02_bhoot_warning.mp4",
        badge: "WARNING",
        type: "button",
        prompt: "Haweli ka raasta aage hai, dhyan se...",
        btnText: "AAGE BADHO ➔"
      },
      {
        video: "03_torch_walk.mp4",
        badge: "GATE #01 PASSWORD",
        type: "input_quiz",
        prompt: "🚪 Pehla darwaza tabhi khulega jab sahi password type karogi: 'Duniya ka sabse bada jhooth kya hai jo Tannu bolti hai?' (Hint: 5 min / so rahi hu / innocent)",
        keywords: ["5 min", "5 minute", "paanch minute", "so rahi", "so rhi", "innocent", "reel", "neend", "sone", "soti"],
        btnText: "UNLOCK GATE 1 🔓"
      },
      {
        video: "04_gate_reveal.mp4",
        badge: "INSIDE HAWELI",
        autoNext: true
      },
      {
        video: "03_torch_walk.mp4",
        badge: "GATE #02 PASSWORD",
        type: "input_quiz",
        prompt: "🚪 Dusra darwaza lock hai! 'Tannu ke pass aesi konsi superpower hai jo 1 second me trigger hoti hai?' (Hint: gussa / drama / nautanki / overthinking)",
        keywords: ["gussa", "anger", "drama", "nautanki", "overthink", "overthinking", "ladai", "hyper", "chidh"],
        btnText: "UNLOCK GATE 2 🔓"
      },
      {
        video: "05_gate_reveal2.mp4",
        badge: "DEEP CHAMBER",
        autoNext: true
      },
      {
        video: "03_torch_walk.mp4",
        badge: "VAULT #03 PASSWORD",
        type: "input_quiz",
        prompt: "🚪 Aakhiri sabse dangerous darwaza! 'Doctor ne Tannu ke brain scan report me kya likha tha?' (Hint: kuch nahi / empty / 404 / 0% / khali)",
        keywords: ["kuch nahi", "kuch nhi", "empty", "khali", "404", "0%", "zero", "not found", "gayab", "no brain"],
        btnText: "UNLOCK SECRET VAULT 🔓"
      },
      {
        video: "06_gate_reveal3.mp4",
        badge: "ALL EVIDENCE UNLOCKED",
        type: "button",
        prompt: "⚠️ Teeno saboot mil gaye! Dayan ka raaz khul gaya!",
        btnText: "AAGE KYA HUA? ➔"
      },
      {
        video: "07_chal_dayan.mp4",
        badge: "SECRET CHAMBER",
        type: "button",
        prompt: "Panda aage bulakar report check kar raha hai...",
        btnText: "REPORT CHECK KARO ➔"
      },
      {
        video: "08_report_gussa.mp4",
        badge: "FINAL VERDICT",
        type: "none"
      }
    ];

    let currentStep = 0;
    const video = document.getElementById("mainVideo");
    const loader = document.getElementById("loader");
    const actionOverlay = document.getElementById("actionOverlay");
    const cardBadge = document.getElementById("cardBadge");
    const cardPrompt = document.getElementById("cardPrompt");
    const cardContent = document.getElementById("cardContent");
    const errorNotice = document.getElementById("errorNotice");

    function showError(msg) {
      errorNotice.innerText = msg;
      errorNotice.style.display = "block";
    }

    video.onerror = () => {
      loader.style.display = "none";
      const fileMissing = video.src.split('/').pop();
      showError("⚠️ Video nahi mili: " + fileMissing + " | Check karo file ka naam!");
    };

    video.onwaiting = () => { loader.style.display = "block"; };
    video.onplaying = () => {
      loader.style.display = "none";
      errorNotice.style.display = "none";
    };

    video.onended = () => {
      onClipEnded();
    };

    function beginTour() {
      document.getElementById("startScreen").style.display = "none";
      loadAndPlay(STORY_FLOW[0].video);
    }

    function loadAndPlay(src) {
      loader.style.display = "block";
      errorNotice.style.display = "none";

      video.src = src;
      video.load();

      const onReady = () => {
        loader.style.display = "none";
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(e => {
            console.warn("Autoplay handler:", e);
            video.muted = false;
            video.play();
          });
        }
        video.removeEventListener('canplay', onReady);
        video.removeEventListener('loadeddata', onReady);
      };

      video.addEventListener('canplay', onReady);
      video.addEventListener('loadeddata', onReady);
    }

    function onClipEnded() {
      const step = STORY_FLOW[currentStep];

      if (step.type === "none") {
        actionOverlay.classList.remove("visible");
        return;
      }

      if (step.autoNext) {
        currentStep++;
        loadAndPlay(STORY_FLOW[currentStep].video);
        return;
      }

      cardBadge.innerText = step.badge;
      cardPrompt.innerText = step.prompt;
      cardContent.innerHTML = "";

      if (step.type === "button") {
        const btn = document.createElement("button");
        btn.className = "btn-action";
        btn.innerText = step.btnText;
        btn.onclick = () => onNextTrigger();
        cardContent.appendChild(btn);
      } else if (step.type === "input_quiz") {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "input-box";
        input.placeholder = "Yahan answer type karo...";
        input.autocomplete = "off";

        const err = document.createElement("div");
        err.className = "error-msg";
        err.innerText = "❌ Galat jawab! Dimag chalao aur sahi guess karo...";

        const submitBtn = document.createElement("button");
        submitBtn.className = "btn-action";
        submitBtn.innerText = step.btnText;

        submitBtn.onclick = () => {
          const val = input.value.trim().toLowerCase();
          if (!val) {
            err.innerText = "⚠️ Pehle kuch type toh karo Dayan!";
            err.style.display = "block";
            return;
          }

          const isMatch = step.keywords.some(kw => val.includes(kw));

          if (isMatch || val.length >= 2) {
            onNextTrigger();
          } else {
            err.style.display = "block";
          }
        };

        input.addEventListener("keyup", (e) => {
          if (e.key === "Enter") submitBtn.click();
        });

        cardContent.appendChild(input);
        cardContent.appendChild(err);
        cardContent.appendChild(submitBtn);
      }

      actionOverlay.classList.add("visible");
    }

    function onNextTrigger() {
      actionOverlay.classList.remove("visible");
      currentStep++;

      if (currentStep < STORY_FLOW.length) {
        loadAndPlay(STORY_FLOW[currentStep].video);
      }
    }
  </script>
</body>
</html>
